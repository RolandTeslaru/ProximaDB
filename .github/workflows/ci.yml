# Tests every pull request and every push to master.
#
# A version tag (v0.1.0) on a commit of master that passes the tests releases it:
#   - the server image for linux/amd64 and linux/arm64, as ghcr.io/rolandteslaru/proximadb:0.1.0 and :latest;
#   - a GitHub Release with the static Linux binaries for both, and their checksums.
name: ci

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  # Image names must be lowercase, and the owner's name isn't.
  IMAGE: ghcr.io/rolandteslaru/proximadb
  # Replaces target-cpu=native from .cargo/config.toml: cached dependencies built on one runner's CPU crash
  # with an illegal instruction on another's. Every x86 runner has these instructions.
  RUSTFLAGS: -C target-cpu=x86-64-v3

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # rustup installs the toolchain pinned in rust-toolchain.toml, with rustfmt and clippy.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --release --all-targets --features server -- -D warnings
      - run: cargo test --release --features server

  # A release is made only from master: a tag on any other commit stops here.
  on-master:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME isn't a commit of master: nothing is released"
            exit 1
          fi

  build:
    needs: [test, on-master]
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      # The same build again, cached, keeping only the binary stage.
      - uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          target: binary
          outputs: type=local,dest=out
          cache-from: type=gha,scope=${{ matrix.platform }}
      - name: package the binary
        run: |
          name="proximadb-$GITHUB_REF_NAME-linux-${PLATFORM#linux/}"
          mv out/proximadb "$name"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ strategy.job-index }}
          path: proximadb-*.tar.gz*
          retention-days: 1
      - run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - working-directory: /tmp/digests
        run: |
          # The tags and digests are meant to split into separate arguments.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

  release:
    needs: merge
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: binaries
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" binaries/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --notes "Image: \`$IMAGE:${GITHUB_REF_NAME#v}\`"
