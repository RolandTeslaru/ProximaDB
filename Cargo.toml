[package]
name = "proximadb"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
csv = "1"
libc = "0.2"
rayon = "1"
rustc-hash = "2"
serde_json = "1"

# The HTTP server (src/bin/server.rs) only: `cargo build --release --features server --bin server`.
axum = { version = "0.8", optional = true }
mimalloc = { version = "0.1", optional = true, default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"], optional = true }
parquet = { version = "60.2.0", default-features = false, features = ["arrow", "snap", "zstd", "lz4"] }
arrow-array = "60.2.0"
arrow-cast = "60.2.0"
arrow-schema = "60.2.0"

[features]
server = ["dep:axum", "dep:mimalloc", "dep:serde", "dep:tokio"]

[[bin]]
name = "server"
required-features = ["server"]

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"
